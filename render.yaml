# Render Blueprint: two services from this repo. Setup steps are in DEPLOY.md.
#
#   stemulate-website  The public website (website/, plain HTML) on Render's
#                      CDN at https://projstemulate.com. Render adds
#                      www.projstemulate.com as a redirect to it.
#   stemulate-academy  The Academy app and its API (Node/Express) at
#                      https://academy.projstemulate.com. Students' data lives
#                      in Supabase (supabase/schema.sql), not on Render.
#
# Render asks for each `sync: false` value once, when the Blueprint is first
# created. To change one later, use the service's Environment tab.
services:
  - type: web
    name: stemulate-website
    runtime: static
    # Plain HTML: nothing to build, and no need to install the app's packages.
    buildCommand: echo "website/ has no build step"
    staticPublishPath: ./website
    domains:
      - projstemulate.com
    # The Workshops page was folded into Home and Curriculum (October 2026).
    routes:
      - type: redirect
        source: /workshops.html
        destination: /
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"

  - type: web
    name: stemulate-academy
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/reference-data
    domains:
      - academy.projstemulate.com
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSKEY
        sync: false
      # Supabase > Project Settings > API Keys: the project URL and a secret
      # key (sb_secret_...). Never the publishable key.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: APP_ORIGIN
        value: https://academy.projstemulate.com
      # Old /site links on the Academy's address go to the website.
      - key: WEBSITE_URL
        value: https://projstemulate.com
      # The two AI chats (Ask STEMbots, the website's "Ask us"). Leave both
      # empty until the AI provider decision in DEPLOY.md; without them the
      # chats say they're switched off and everything else works.
      # GEMINI_API (the name set on Render) is read too.
      - key: GEMINI_API_KEY
        sync: false
      # Optional: its own key (and quota) for the website's assistant.
      - key: GEMINI_SITE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Emails the team about website sign-ups through Resend (server/notify.js).
      - key: RESEND_API_KEY
        sync: false
      - key: SIGNUP_NOTIFY_EMAIL
        sync: false
      # A whole class signs in from one centre's Wi-Fi, i.e. one IP address.
      # Each username still locks after 5 wrong PINs.
      - key: AUTH_RATE_LIMIT_PER_MIN
        value: "200"
